name: "Terraform Deployment"

on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    container:
      image: hashicorp/terraform:latest

    services:
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: "mock-root-token"
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

      # FIXED: Matches the exact working image name from your local docker ps output!
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # This step will find your vault container at http://vault:8200
      - name: Fetch Keys from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://vault:8200
          role: gh-actions-role
          method: jwt
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY

      - name: Execute Terraform Pipeline
        env:
          AWS_ENDPOINT_URL: http://floci:4566
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init
          terraform plan
          terraform apply -auto-approve
